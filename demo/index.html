<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onwave demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    #status {
      font-size: 1rem;
      color: #888;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #status.listening { color: #4ade80; }
    #status.triggered { color: #facc15; }
    #status.calibrating { color: #60a5fa; }
    #wave-btn {
      padding: 2rem 3.5rem;
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: #1a1a1a;
      color: #fff;
      border: 2px solid #333;
      border-radius: 1.5rem;
      cursor: default;
      transition: background 80ms ease, border-color 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      user-select: none;
    }
    #wave-btn.pressed {
      background: #4ade80;
      border-color: #4ade80;
      color: #000;
      transform: scale(0.94);
      box-shadow: 0 0 32px #4ade8066;
    }
    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 260px;
    }
    #controls label {
      font-size: 0.85rem;
      color: #888;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }
    #threshold-slider {
      width: 100%;
      accent-color: #4ade80;
    }
    #start-btn {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
    }
    #start-btn:hover { background: #ddd; }
  </style>
</head>
<body>
  <div id="status">idle</div>
  <button id="wave-btn">Wave — 0</button>
  <div id="controls">
    <label>
      <span>Sensitivity (threshold)</span>
      <span id="threshold-value">40</span>
    </label>
    <input id="threshold-slider" type="range" min="5" max="100" value="40" />
  </div>
  <button id="start-btn">Start camera</button>

  <script type="module">
    import { createWaveDetector } from '../src/index.ts'

    let count = 0
    const statusEl = document.getElementById('status')
    const waveBtnEl = document.getElementById('wave-btn')
    const startBtn = document.getElementById('start-btn')
    const slider = document.getElementById('threshold-slider')
    const thresholdValue = document.getElementById('threshold-value')

    let pressTimeout = null

    function flash() {
      waveBtnEl.classList.add('pressed')
      if (pressTimeout) clearTimeout(pressTimeout)
      pressTimeout = setTimeout(() => waveBtnEl.classList.remove('pressed'), 300)
    }

    const detector = createWaveDetector({
      onWave: () => {
        count++
        waveBtnEl.textContent = `Wave — ${count}`
        flash()
      },
      onStateChange: (state) => {
        statusEl.textContent = state
        statusEl.className = state
      },
      threshold: 40,
      cooldown: 1000,
    })

    slider.addEventListener('input', () => {
      const val = Number(slider.value)
      thresholdValue.textContent = val
      detector.setThreshold(val)
    })

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none'
      await detector.start()
    })
  </script>
</body>
</html>
